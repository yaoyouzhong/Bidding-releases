<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="308" viewBox="0 0 1120 308"><rect width="1120" height="308" rx="18" fill="#101f35"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="57" font-size="28" fill="#eaf1fb" font-weight="700">从资料到交付，五步衔接</text><text x="42" y="90" font-size="16" fill="#a8bcd5" font-weight="400">先有来源，再做检查；问题处理后，由人工确认终审。</text><rect x="42" y="125" width="192" height="145" rx="8" fill="#1d334d"/><text x="59" y="158" font-size="17" fill="#56dbcb" font-weight="400">01</text><text x="59" y="198" font-size="20" fill="#eaf1fb" font-weight="700">招标文件</text><text x="59" y="235" font-size="13" fill="#bbcbde" font-weight="400">导入要求与来源</text><rect x="255" y="125" width="192" height="145" rx="8" fill="#1d334d"/><text x="272" y="158" font-size="17" fill="#56dbcb" font-weight="400">02</text><text x="272" y="198" font-size="20" fill="#eaf1fb" font-weight="700">投标准备</text><text x="272" y="235" font-size="13" fill="#bbcbde" font-weight="400">整理企业与人员资料</text><rect x="468" y="125" width="192" height="145" rx="8" fill="#1d334d"/><text x="485" y="158" font-size="17" fill="#56dbcb" font-weight="400">03</text><text x="485" y="198" font-size="20" fill="#eaf1fb" font-weight="700">投标文件检查</text><text x="485" y="235" font-size="13" fill="#bbcbde" font-weight="400">格式检查与响应核对</text><rect x="681" y="125" width="192" height="145" rx="8" fill="#1d334d"/><text x="698" y="158" font-size="17" fill="#56dbcb" font-weight="400">04</text><text x="698" y="198" font-size="20" fill="#eaf1fb" font-weight="700">问题处理</text><text x="698" y="235" font-size="13" fill="#bbcbde" font-weight="400">查看证据并逐项处理</text><rect x="894" y="125" width="192" height="145" rx="8" fill="#1d334d"/><text x="911" y="158" font-size="17" fill="#56dbcb" font-weight="400">05</text><text x="911" y="198" font-size="20" fill="#eaf1fb" font-weight="700">终审与交付</text><text x="911" y="235" font-size="13" fill="#bbcbde" font-weight="400">人工确认后归档</text></g></svg>