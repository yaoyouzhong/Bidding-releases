<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" role="img" aria-labelledby="title">
<title id="title">02 / 把一份招标模板，变成一批人员简历</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1200" height="234" rx="24" fill="#0f172a" stroke="none"/><text x="40" y="59" font-size="32" fill="#e2e8f0" font-weight="700">02 / 把一份招标模板，变成一批人员简历</text><text x="42" y="116" font-size="23" fill="#5eead4" font-weight="700">准备</text><text x="42" y="161" font-size="24" fill="#e2e8f0" font-weight="400">已确认人员档案</text><text x="42" y="198" font-size="21" fill="#94a3b8" font-weight="400">本次招标表格</text><path d="M 357 155 H 408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="438" y="116" font-size="23" fill="#5eead4" font-weight="700">确认</text><text x="438" y="161" font-size="24" fill="#e2e8f0" font-weight="400">人员、角色与顺序</text><text x="438" y="198" font-size="21" fill="#94a3b8" font-weight="400">模板与字段对应</text><path d="M 753 155 H 804" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="834" y="116" font-size="23" fill="#5eead4" font-weight="700">生成</text><text x="834" y="161" font-size="24" fill="#e2e8f0" font-weight="400">批量填入并校验</text><text x="834" y="198" font-size="21" fill="#94a3b8" font-weight="400">输出 Word 与质量报告</text></svg>