<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520"><rect width="1120" height="520" rx="18" fill="#101f35"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="52" y="52" width="44" height="44" rx="10" fill="#56dbcb"/><text x="62" y="83" font-size="27" fill="#101f35" font-weight="700">标</text><text x="113" y="83" font-size="27" fill="#eaf1fb" font-weight="700">标书工作台</text><text x="54" y="178" font-size="48" fill="#eaf1fb" font-weight="700">资料不必反复找，</text><text x="54" y="241" font-size="48" fill="#eaf1fb" font-weight="700">复核有据可查。</text><text x="56" y="295" font-size="20" fill="#a8bcd5" font-weight="400">资料复用 · 要求核对 · 原件定位 · 批量核验</text><rect x="56" y="348" width="248" height="44" rx="8" fill="#233a55"/><text x="74" y="377" font-size="18" fill="#eaf1fb" font-weight="400">Windows 本地桌面工具</text><text x="57" y="454" font-size="18" fill="#56dbcb" font-weight="400">材料在本机，判断有依据。</text><rect x="715" y="74" width="352" height="390" rx="12" fill="#28415c"/><rect x="690" y="98" width="352" height="390" rx="12" fill="#f4f7fc"/><text x="720" y="140" font-size="23" fill="#152942" font-weight="700">复核工作档案</text><text x="720" y="171" font-size="13" fill="#62768e" font-weight="400">功能示意 · 非实际项目资料</text><rect x="718" y="191" width="294" height="47" rx="8" fill="#e5edf6"/><rect x="732" y="204" width="7" height="7" rx="8" fill="#2d7d98"/><text x="751" y="212" font-size="16" fill="#263e58" font-weight="400">招标要求 / 来源原文</text><rect x="718" y="252" width="294" height="47" rx="8" fill="#e5edf6"/><rect x="732" y="265" width="7" height="7" rx="8" fill="#2d7d98"/><text x="751" y="273" font-size="16" fill="#263e58" font-weight="400">投标响应 / 对照证据</text><rect x="718" y="313" width="294" height="47" rx="8" fill="#e5edf6"/><rect x="732" y="326" width="7" height="7" rx="8" fill="#c17c30"/><text x="751" y="334" font-size="16" fill="#263e58" font-weight="400">发现问题 / 人工确认</text><rect x="720" y="399" width="122" height="34" rx="8" fill="#153953"/><text x="737" y="422" font-size="14" fill="#eaf1fb" font-weight="400">留存复核记录</text><text x="865" y="422" font-size="16" fill="#267867" font-weight="400">可追溯</text></g></svg>