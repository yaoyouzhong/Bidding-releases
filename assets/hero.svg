<rect x="0" y="0" width="1200" height="640" rx="24" fill="#0f172a" stroke="none"/><rect x="48" y="44" width="48" height="48" rx="12" fill="#5eead4" stroke="none"/><text x="57" y="79" font-size="30" fill="#0f172a" font-weight="700">标</text><text x="112" y="79" font-size="28" fill="#e2e8f0" font-weight="700">标证</text><text x="48" y="163" font-size="58" fill="#e2e8f0" font-weight="700">把时间留给方案。</text><text x="48" y="232" font-size="40" fill="#e2e8f0" font-weight="700">让准备、编制与复核，衔接起来。</text><text x="50" y="290" font-size="25" fill="#94a3b8" font-weight="400">AI 辅助读懂要求与材料，工作台承接编制、核对和留档。</text><path d="M 76 383 H 1122" fill="none" stroke="#334155" stroke-width="3"/><circle cx="76" cy="383" r="25" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="60" y="391" font-size="22" fill="#5eead4" font-weight="700">01</text><text x="50" y="452" font-size="28" fill="#e2e8f0" font-weight="700">理解招标</text><text x="50" y="492" font-size="21" fill="#cbd5e1" font-weight="400">要求与评分</text><text x="50" y="523" font-size="21" fill="#94a3b8" font-weight="400">原文定位</text><circle cx="304" cy="383" r="25" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="288" y="391" font-size="22" fill="#5eead4" font-weight="700">02</text><text x="278" y="452" font-size="28" fill="#e2e8f0" font-weight="700">准备材料</text><text x="278" y="492" font-size="21" fill="#cbd5e1" font-weight="400">企业 · 人员 · 案例</text><text x="278" y="523" font-size="21" fill="#94a3b8" font-weight="400">识别与核验</text><circle cx="532" cy="383" r="25" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="516" y="391" font-size="22" fill="#5eead4" font-weight="700">03</text><text x="506" y="452" font-size="28" fill="#e2e8f0" font-weight="700">按标编制</text><text x="506" y="492" font-size="21" fill="#cbd5e1" font-weight="400">简历与人员清单</text><text x="506" y="523" font-size="21" fill="#94a3b8" font-weight="400">案例与企业整册</text><circle cx="760" cy="383" r="25" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="744" y="391" font-size="22" fill="#5eead4" font-weight="700">04</text><text x="734" y="452" font-size="28" fill="#e2e8f0" font-weight="700">核对风险</text><text x="734" y="492" font-size="21" fill="#cbd5e1" font-weight="400">格式 · 响应 · 关联</text><text x="734" y="523" font-size="21" fill="#94a3b8" font-weight="400">问题与证据</text><circle cx="988" cy="383" r="25" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="972" y="391" font-size="22" fill="#5eead4" font-weight="700">05</text><text x="962" y="452" font-size="28" fill="#e2e8f0" font-weight="700">终审交付</text><text x="962" y="492" font-size="21" fill="#cbd5e1" font-weight="400">整改与人工终审</text><text x="962" y="523" font-size="21" fill="#94a3b8" font-weight="400">原件与记录归档</text><text x="50" y="603" font-size="20" fill="#94a3b8" font-weight="400">Windows 桌面应用</text><text x="820" y="603" font-size="20" fill="#5eead4" font-weight="400">资料本地管理 · AI 按需开启</text></svg>