<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" role="img" aria-labelledby="title">
<title id="title">AI 读取招标文件、档案和响应内容，提取带依据的候选与建议，衔接程序编制检查和人工确认</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1200" height="866" rx="24" fill="#0f172a" stroke="none"/><text x="48" y="67" font-size="38" fill="#e2e8f0" font-weight="700">AI 如何把“读材料”接到“做事情”</text><text x="48" y="111" font-size="23" fill="#94a3b8" font-weight="400">把不同写法、不同版式的内容，整理成可以核对和继续使用的信息。</text><rect x="68" y="190" width="330" height="350" rx="8" fill="#233149" stroke="none"/><rect x="53" y="175" width="330" height="350" rx="8" fill="#334155" stroke="none"/><rect x="38" y="160" width="330" height="350" rx="8" fill="#f1f5f9" stroke="none"/><text x="66" y="207" font-size="25" fill="#0f172a" font-weight="700">招标文件与业务材料</text><rect x="61" y="231" width="284" height="35" rx="3" fill="#ccfbf1" stroke="none"/><text x="72" y="257" font-size="22" fill="#115e59" font-weight="700">招标条款</text><text x="72" y="290" font-size="18" fill="#475569" font-weight="400">资格条件 / 评分要求</text><rect x="61" y="324" width="284" height="35" rx="3" fill="#ccfbf1" stroke="none"/><text x="72" y="350" font-size="22" fill="#115e59" font-weight="700">人员与证件</text><text x="72" y="383" font-size="18" fill="#475569" font-weight="400">姓名 / 学历 / 证照字段</text><rect x="61" y="417" width="284" height="35" rx="3" fill="#ccfbf1" stroke="none"/><text x="72" y="443" font-size="22" fill="#115e59" font-weight="700">投标响应</text><text x="72" y="476" font-size="18" fill="#475569" font-weight="400">技术方案 / 证明材料</text><path d="M 398 334 H 457" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="570" cy="328" r="95" fill="#103344" stroke="#22d3ee" stroke-width="2"/><circle cx="570" cy="328" r="76" fill="none" stroke="#256176" stroke-dasharray="4 8"/><path d="M 636 397 L 669 430" fill="none" stroke="#22d3ee" stroke-width="13"/><text x="536" y="321" font-size="48" fill="#67e8f9" font-weight="700">AI</text><text x="507" y="364" font-size="16" fill="#cffafe" font-weight="400">提取 · 理解 · 关联</text><text x="461" y="487" font-size="22" fill="#67e8f9" font-weight="400">理解内容之间的关系</text><path d="M 681 334 H 749" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="768" y="180" width="386" height="95" rx="12" fill="#1e293b" stroke="none"/><rect x="768" y="180" width="5" height="95" rx="2" fill="#a78bfa" stroke="none"/><text x="792" y="215" font-size="25" fill="#e2e8f0" font-weight="700">要求候选</text><text x="792" y="250" font-size="20" fill="#cbd5e1" font-weight="400">保留原文，确认本次条件</text><rect x="768" y="296" width="386" height="95" rx="12" fill="#1e293b" stroke="none"/><rect x="768" y="296" width="5" height="95" rx="2" fill="#a78bfa" stroke="none"/><text x="792" y="331" font-size="25" fill="#e2e8f0" font-weight="700">档案字段</text><text x="792" y="366" font-size="20" fill="#cbd5e1" font-weight="400">对照原件，处理缺失与冲突</text><rect x="768" y="412" width="386" height="95" rx="12" fill="#1e293b" stroke="none"/><rect x="768" y="412" width="5" height="95" rx="2" fill="#a78bfa" stroke="none"/><text x="792" y="447" font-size="25" fill="#e2e8f0" font-weight="700">响应建议</text><text x="792" y="482" font-size="20" fill="#cbd5e1" font-weight="400">关联片段，指出待核对内容</text><path d="M 955 522 V 580 H 305 V 598" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="557" font-size="18" fill="#a78bfa" font-weight="400">带着依据，进入下一步</text><rect x="48" y="611" width="515" height="166" rx="16" fill="#122d32" stroke="none"/><text x="76" y="653" font-size="26" fill="#5eead4" font-weight="700">程序承接</text><text x="76" y="699" font-size="25" fill="#e2e8f0" font-weight="400">按确认的模板批量生成</text><text x="76" y="741" font-size="20" fill="#cbd5e1" font-weight="400">计算日期 · 运行检查 · 保存结果</text><path d="M 573 693 H 620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="638" y="611" width="514" height="166" rx="16" fill="#302a23" stroke="none"/><text x="666" y="653" font-size="26" fill="#fbbf24" font-weight="700">用户作出判断</text><text x="666" y="699" font-size="25" fill="#e2e8f0" font-weight="400">对照原文与原件，确认或修正</text><text x="666" y="741" font-size="20" fill="#cbd5e1" font-weight="400">处理问题后，再进行人工终审</text><text x="48" y="829" font-size="21" fill="#94a3b8" font-weight="400">AI 输出是候选与建议；授权相应用途后使用，不自动批准终审。</text></svg>