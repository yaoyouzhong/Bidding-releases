<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" role="img" aria-labelledby="title">
<title id="title">03 / 把逐人查询，变成一批可跟进的核验</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1200" height="234" rx="24" fill="#0f172a" stroke="none"/><text x="40" y="59" font-size="32" fill="#e2e8f0" font-weight="700">03 / 把逐人查询，变成一批可跟进的核验</text><text x="42" y="116" font-size="23" fill="#5eead4" font-weight="700">准备</text><text x="42" y="161" font-size="24" fill="#e2e8f0" font-weight="400">选择本次人员</text><text x="42" y="198" font-size="21" fill="#94a3b8" font-weight="400">确认姓名与证书信息</text><path d="M 357 155 H 408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="438" y="116" font-size="23" fill="#5eead4" font-weight="700">核验</text><text x="438" y="161" font-size="24" fill="#e2e8f0" font-weight="400">发起批量官网查询</text><text x="438" y="198" font-size="21" fill="#94a3b8" font-weight="400">逐人跟进验证状态</text><path d="M 753 155 H 804" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="834" y="116" font-size="23" fill="#5eead4" font-weight="700">留存</text><text x="834" y="161" font-size="24" fill="#e2e8f0" font-weight="400">检查并保存结果截图</text><text x="834" y="198" font-size="21" fill="#94a3b8" font-weight="400">未完成项继续处理</text></svg>