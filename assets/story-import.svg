<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" role="img" aria-labelledby="title">
<title id="title">批量资料建档：选择文件或文件夹，识别类型与字段，核对归档，复用于项目编制和核验</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1200" height="234" rx="24" fill="#0f172a" stroke="none"/><text x="40" y="59" font-size="32" fill="#e2e8f0" font-weight="700">01 / 把成批文件，整理成可复用的资料档案</text><text x="40" y="115" font-size="23" fill="#5eead4" font-weight="700">批量选择</text><text x="40" y="160" font-size="24" fill="#e2e8f0" font-weight="400">文件夹及子目录</text><text x="40" y="198" font-size="21" fill="#94a3b8" font-weight="400">或一次多选文件</text><path d="M 272 150 H 315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="115" font-size="23" fill="#5eead4" font-weight="700">识别整理</text><text x="335" y="160" font-size="24" fill="#e2e8f0" font-weight="400">识别资料类型</text><text x="335" y="198" font-size="21" fill="#94a3b8" font-weight="400">提取关键字段</text><path d="M 567 150 H 610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="115" font-size="23" fill="#5eead4" font-weight="700">核对归档</text><text x="630" y="160" font-size="24" fill="#e2e8f0" font-weight="400">对照原件确认</text><text x="630" y="198" font-size="21" fill="#94a3b8" font-weight="400">缺项单独处理</text><path d="M 862 150 H 905" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="115" font-size="23" fill="#5eead4" font-weight="700">后续复用</text><text x="925" y="160" font-size="24" fill="#e2e8f0" font-weight="400">人员与案例档案</text><text x="925" y="198" font-size="21" fill="#94a3b8" font-weight="400">接入编制和核验</text></svg>