<rect x="0" y="0" width="1200" height="234" rx="24" fill="#0f172a" stroke="none"/><text x="40" y="59" font-size="32" fill="#e2e8f0" font-weight="700">04 / 从本次招标要求，追到具体问题与处理</text><text x="42" y="116" font-size="23" fill="#5eead4" font-weight="700">确定依据</text><text x="42" y="161" font-size="24" fill="#e2e8f0" font-weight="400">确认招标要求</text><text x="42" y="198" font-size="21" fill="#94a3b8" font-weight="400">导入当前投标文件包</text><path d="M 357 155 H 408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="438" y="116" font-size="23" fill="#5eead4" font-weight="700">运行检查</text><text x="438" y="161" font-size="24" fill="#e2e8f0" font-weight="400">格式与完整性检查</text><text x="438" y="198" font-size="21" fill="#94a3b8" font-weight="400">招标要求响应核对</text><path d="M 753 155 H 804" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="834" y="116" font-size="23" fill="#5eead4" font-weight="700">处理问题</text><text x="834" y="161" font-size="24" fill="#e2e8f0" font-weight="400">对照原文与物理页</text><text x="834" y="198" font-size="21" fill="#94a3b8" font-weight="400">整改或记录人工结论</text></svg>