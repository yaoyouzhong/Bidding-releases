<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="338" viewBox="0 0 1120 338"><rect width="1120" height="338" rx="18" fill="#101f35"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="55" font-size="28" fill="#eaf1fb" font-weight="700">整理一次，在项目中有序使用</text><rect x="42" y="94" width="312" height="208" rx="8" fill="#1c324c"/><rect x="64" y="118" width="30" height="4" rx="2" fill="#56dbcb"/><text x="64" y="159" font-size="23" fill="#eaf1fb" font-weight="700">企业资料</text><text x="64" y="199" font-size="16" fill="#bfcede" font-weight="400">基本资料与证照资质</text><text x="64" y="231" font-size="16" fill="#bfcede" font-weight="400">财务、纳税与社保证明</text><text x="64" y="263" font-size="16" fill="#bfcede" font-weight="400">关联关系与信用留存</text><rect x="404" y="94" width="312" height="208" rx="8" fill="#1c324c"/><rect x="426" y="118" width="30" height="4" rx="2" fill="#7eb4fb"/><text x="426" y="159" font-size="23" fill="#eaf1fb" font-weight="700">人员资料</text><text x="426" y="199" font-size="16" fill="#bfcede" font-weight="400">学历、资格与经历材料</text><text x="426" y="231" font-size="16" fill="#bfcede" font-weight="400">OCR 辅助提取关键字段</text><text x="426" y="263" font-size="16" fill="#bfcede" font-weight="400">对照原件进行人工复核</text><rect x="766" y="94" width="312" height="208" rx="8" fill="#1c324c"/><rect x="788" y="118" width="30" height="4" rx="2" fill="#ffc778"/><text x="788" y="159" font-size="23" fill="#eaf1fb" font-weight="700">项目文件</text><text x="788" y="199" font-size="16" fill="#bfcede" font-weight="400">多个分册组成文件包</text><text x="788" y="231" font-size="16" fill="#bfcede" font-weight="400">关联检查与处理记录</text><text x="788" y="263" font-size="16" fill="#bfcede" font-weight="400">原件与归档校验清单</text></g></svg>